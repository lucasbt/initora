name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          mapfile -d '' files < <(
            find . -type f \( -name '*.sh' -o -name '*.bash' -o -name 'initora' \) -print0
          )
          for file in "${files[@]}"; do
            echo "bash -n $file"
            bash -n "$file"
          done

      - name: ShellCheck
        run: |
          mapfile -d '' files < <(
            find . -type f \( -name '*.sh' -o -name '*.bash' -o -name 'initora' \) -print0
          )
          shellcheck -x -S warning "${files[@]}"

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  fedora-smoke:
    name: Fedora smoke test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install git for checkout
        run: dnf install -y git tar gzip

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install runtime dependencies
        run: dnf install -y bash coreutils findutils gawk grep sed util-linux shadow-utils

      - name: CLI smoke test
        run: |
          useradd -m -s /bin/bash tester
          mkdir -p /home/tester/.local/share
          cp -a "$GITHUB_WORKSPACE" /home/tester/.local/share/initora
          chown -R tester:tester /home/tester

          su - tester -c '$HOME/.local/share/initora/initora --help' > /tmp/initora-help.txt
          grep -q -- '-ia' /tmp/initora-help.txt
          su - tester -c '$HOME/.local/share/initora/initora list'

          # Comma-separated module IDs are no longer supported.
          if su - tester -c 'TERM=xterm ~/.local/share/initora/initora install -m 20,30'; then
            echo "Expected comma-separated module IDs to be rejected" >&2
            exit 1
          fi
